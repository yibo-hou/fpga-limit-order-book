[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-lob-reference"
version = "0.1.0"
description = "Golden Python reference model for the FPGA limit order book"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["fpga", "limit-order-book", "market-data", "systemverilog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["lob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
